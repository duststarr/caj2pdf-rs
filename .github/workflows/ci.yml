name: ci

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (non-GUI crates)
        run: cargo clippy --workspace --exclude caj2pdf-gui --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --verbose

      - name: Build GUI crate
        # The GUI crate needs a display to run tests, so we only
        # compile it in CI, not test it. Eframe's macros sometimes
        # trip clippy lints, so we also exclude it from the clippy
        # step above.
        run: cargo build -p caj2pdf-gui --verbose

      - name: Test
        run: cargo test --workspace --exclude caj2pdf-gui --verbose

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
